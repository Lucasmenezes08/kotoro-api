apiVersion: v1
kind: Service
metadata:
  name: analytics-api
  labels:
    app.kubernetes.io/name: analytics-api
spec:
  selector:
    app.kubernetes.io/name: analytics-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api
  labels:
    app.kubernetes.io/name: analytics-api
spec:
  replicas: 2 # stateless: every request gets its own session from its own pool
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-schema
          image: kotoro-analytics
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - kotoro_analytics.infrastructure.database.wait_for_schema
            - --timeout=600
          envFrom:
            - configMapRef: { name: analytics-config }
            - secretRef: { name: analytics-secrets }
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
      containers:
        - name: api
          image: kotoro-analytics
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef: { name: analytics-config }
            - secretRef: { name: analytics-secrets }
          # Liveness never touches the database: a database outage must not restart pods.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # Readiness removes the pod from the Service while the database is unreachable.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext: *restricted
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
      terminationGracePeriodSeconds: 30
