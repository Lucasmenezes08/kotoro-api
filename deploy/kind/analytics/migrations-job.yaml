# Applies the read-model migrations. The API and the consumer wait for the result in
# their initContainers (wait_for_schema), since Kubernetes does not order resources.
apiVersion: batch/v1
kind: Job
metadata:
  name: analytics-migrations
  labels:
    app.kubernetes.io/name: analytics-migrations
spec:
  backoffLimit: 10 # retries while postgres-analytics is still starting
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-migrations
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrations
          image: kotoro-analytics
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: ANALYTICS_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: analytics-secrets, key: ANALYTICS_DATABASE_URL }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
