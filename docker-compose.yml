services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    command: ["./kotoro-api"]
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      # Shared with analytics-api (ANALYTICS_JWT_SECRET); see analytics ADR 0002.
      JWT_SECRET: ${JWT_SECRET:-kotoro-local-development-jwt-secret-0001}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kotoro-net

  outbox-relay:
    build:
      context: .
      dockerfile: dockerfile
    command: ["./outbox-relay"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      OUTBOX_EXCHANGE: kotoro.domain-events
      OUTBOX_RELAY_ID: relay-compose-1
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - kotoro-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - kotoro-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kotoro-net

  # Applies the analytics read-model migrations once, then exits.
  analytics-migrations:
    build: &analytics-build
      context: ./analytics
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &analytics-db-env
      ANALYTICS_DATABASE_URL: postgresql+asyncpg://${ANALYTICS_POSTGRES_USER:-analytics}:${ANALYTICS_POSTGRES_PASSWORD:-analytics}@postgres-analytics:5432/${ANALYTICS_POSTGRES_DB:-kotoro_analytics}
    depends_on:
      postgres-analytics:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"
    networks:
      - kotoro-net

  analytics-api:
    build: *analytics-build
    ports:
      - "8001:8001"
    environment:
      <<: *analytics-db-env
      ANALYTICS_ENVIRONMENT: ${ANALYTICS_ENVIRONMENT:-local}
      ANALYTICS_LOG_LEVEL: ${ANALYTICS_LOG_LEVEL:-info}
      ANALYTICS_METRICS_TIMEZONE: ${ANALYTICS_METRICS_TIMEZONE:-America/Sao_Paulo}
      ANALYTICS_JWT_SECRET: ${JWT_SECRET:-kotoro-local-development-jwt-secret-0001}
    depends_on:
      analytics-migrations:
        condition: service_completed_successfully
    networks:
      - kotoro-net

  # Reads kotoro.analytics.events and writes the projections (no HTTP port).
  analytics-consumer:
    build: *analytics-build
    command: ["python", "-m", "kotoro_analytics.consumer"]
    environment:
      <<: *analytics-db-env
      ANALYTICS_ENVIRONMENT: ${ANALYTICS_ENVIRONMENT:-local}
      ANALYTICS_LOG_LEVEL: ${ANALYTICS_LOG_LEVEL:-info}
      ANALYTICS_METRICS_TIMEZONE: ${ANALYTICS_METRICS_TIMEZONE:-America/Sao_Paulo}
      ANALYTICS_RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
    depends_on:
      analytics-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
    networks:
      - kotoro-net

  postgres-analytics:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ANALYTICS_POSTGRES_DB:-kotoro_analytics}
      POSTGRES_USER: ${ANALYTICS_POSTGRES_USER:-analytics}
      POSTGRES_PASSWORD: ${ANALYTICS_POSTGRES_PASSWORD:-analytics}
    ports:
      - "5433:5432"
    volumes:
      - postgres_analytics_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kotoro-net

volumes:
  postgres_data:
  rabbitmq_data:
  postgres_analytics_data:

networks:
  kotoro-net:
    driver: bridge
